<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../vendor/fonts/fonts.css">
<style>
html,body{margin:0;width:1920px;height:1280px;overflow:hidden;background:#0a1128}
.b{position:relative;width:1920px;height:1280px;overflow:hidden;background:radial-gradient(90% 120% at 50% 15%,#1f3370 0%,#132042 40%,#0a1128 78%);font-family:Inter,system-ui,sans-serif}
.sky{position:absolute;inset:0;background-image:
radial-gradient(2.5px 2.5px at 8% 20%,#fffb 50%,transparent 51%),radial-gradient(2px 2px at 17% 9%,#fff9 50%,transparent 51%),radial-gradient(3px 3px at 29% 27%,#fffa 50%,transparent 51%),
radial-gradient(2px 2px at 38% 12%,#fff8 50%,transparent 51%),radial-gradient(2.5px 2.5px at 63% 10%,#fff9 50%,transparent 51%),radial-gradient(2px 2px at 71% 33%,#fff8 50%,transparent 51%),
radial-gradient(2px 2px at 86% 22%,#fff9 50%,transparent 51%),radial-gradient(2px 2px at 94% 40%,#fff7 50%,transparent 51%),radial-gradient(2px 2px at 4% 44%,#fff6 50%,transparent 51%),radial-gradient(2px 2px at 52% 6%,#fff7 50%,transparent 51%)}
.moon{position:absolute;top:110px;right:220px;width:130px;height:130px;border-radius:50%;box-shadow:inset -28px 12px 0 0 #f5c451;transform:rotate(-12deg);filter:drop-shadow(0 0 30px #f5c45166)}
.city{position:absolute;left:0;right:0;bottom:0;width:100%;height:32%;object-fit:cover;object-position:bottom}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:90px}
.em{width:300px;filter:drop-shadow(0 16px 36px #000a)}
.t{font-family:'Playfair Display',Georgia,serif;font-size:150px;line-height:1;margin:18px 0 10px;background:linear-gradient(180deg,#ffe39a,#e0a92e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.g{font-size:32px;letter-spacing:12px;color:#8d9cc4;text-transform:uppercase}
</style></head><body><div class="b"><div class="sky"></div><div class="moon"></div>
<img class="city" src="../../../img/skyline.svg"><div class="c"><img class="em" src="../../../img/emblem.svg"><div class="t">Kibar Hırsız</div><div class="g">İstanbul, 1924</div></div></div></body></html>
