<body>
  <div class="game"><div id="ui"></div><div id="layer"></div>
    <!-- Yükleme ve açılış ekranı -->
    <div id="splash" class="splash">
      <div class="sp-sky"><span class="sp-moon"></span></div>
      <img class="sp-city" src="img/skyline.svg" alt="">
      <div class="sp-center">
        <img class="sp-emblem" src="img/emblem.svg" alt="">
        <h1 class="sp-title">Kibar Hırsız</h1>
        <div class="sp-tag"></div>
        <div class="sp-load"><div class="sp-bar"><i></i></div><div class="sp-tip">Yükleniyor…</div></div>
        <div class="sp-menu"><button class="sp-play">Oyuna başla</button><div class="sp-save"></div></div>
      </div>
    </div>
  </div>

  <!-- Dönem paketi: başka bir dönem için sadece bu satırı değiştir. -->
  <script>
    // Telefon gibi kısa ekranlarda arayüzü orantılı küçültür.
    // Telefon dik tutuluyorsa oyunu 90° döndürüp yine yatay gösterir.
    (function () {
      const g = document.querySelector('.game');
      function fit() {
        const rot = innerHeight > innerWidth && innerWidth <= 760;
        const w = rot ? innerHeight : innerWidth, h = rot ? innerWidth : innerHeight;
        const small = h <= 520 || w <= 760;
        const z = Math.max(0.78, Math.min(1, h / 460, w / 900));
        const on = small && (z < 1 || rot);
        g.classList.toggle('fit', on);
        g.classList.toggle('rot', rot);
        g.style.setProperty('--z', z.toFixed(3));
        g.style.width = on ? (w / z) + 'px' : '';
        g.style.height = on ? (h / z) + 'px' : '';
      }
      addEventListener('resize', fit); addEventListener('orientationchange', fit); fit();
    })();
  </script>
